<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Investigation Hint System</title>
  <link rel="stylesheet" href="css.css" />
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1 style="margin-top:0">Система подсказок</h1>

      <div class="kpi">
        <div>Глава: <span id="uiChapter">1</span></div>
        <div>Прогресс: <span id="uiProgress">0%</span></div>
        <div>Очки расследования: <span id="uiPoints">0</span></div>
        <div>Уровень тупика: <span id="uiStuck">0</span></div>
      </div>

      <div class="row" style="margin-top:12px">
        <label>Прогресс главы <input id="progressInput" type="number" min="0" max="100" value="0"></label>
        <button id="applyProgressBtn">Применить</button>
        <button id="nextChapterBtn">Следующая глава</button>
        <button id="softHintBtn">Мягкая подсказка</button>
        <button id="hardHintBtn">Жёсткая подсказка</button>
      </div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0">Стоимость</h2>
      <div class="row">
        <div>Мягкая: <span id="softCostText"></span></div>
        <div>Жёсткая: <span id="hardCostText"></span></div>
        <div class="small" id="cooldownText"></div>
      </div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0">Подсказка</h2>
      <div id="hintBox" class="muted">Пока подсказка не запрошена.</div>
      <div id="hintHistory" class="hint-history"></div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0">Доска</h2>
      <div class="board" id="board">
        <div class="card board-clue">Улика A</div>
        <div class="card board-clue">Улика B</div>
        <div class="card board-suspect">Подозреваемый 1</div>
        <div class="card board-suspect">Подозреваемый 2</div>
      </div>
    </div>
  </div>

  <script src="ai_engine.js"></script>
  <script src="game.js"></script>
</body>
            </html>
