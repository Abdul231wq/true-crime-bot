<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True Crime Bot — Дело</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">TC</div>
        <div>
          <h1>TRUE CRIME BOT</h1>
          <p>Страница 1 — Состав дела</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><span>ДЕЛО</span><strong data-ui-chapter>1</strong></div>
        <div class="stat"><span>ОЧКИ</span><strong data-ui-points>20</strong></div>
        <div class="stat"><span>ЖИЗНИ</span><strong data-ui-lives>0</strong></div>
      </div>
    </header>

    <main class="panel">
      <div class="page-head">
        <div>
          <span>СТРАНИЦА 1</span>
          <h2>Состав дела</h2>
        </div>
        <button class="btn btn-primary" data-nav="./case.html">Перейти к игре</button>
      </div>

      <div class="card">
        <h3>История дела</h3>
        <p>Ночь. Закрытая комната. Один человек мёртв, трое под подозрением. Сначала выбери преступника.</p>
      </div>

      <div class="grid-3" style="margin-top:12px">
        <button class="card btn suspect selected" data-suspect="suspect-a" type="button">
          <h4>Алексей Морозов</h4>
          <p>Неполное алиби, был рядом с местом преступления.</p>
        </button>

        <button class="card btn suspect" data-suspect="suspect-b" type="button">
          <h4>Марина Логинова</h4>
          <p>Версия расходится со временем звонка.</p>
        </button>

        <button class="card btn suspect" data-suspect="suspect-c" type="button">
          <h4>Игорь Белый</h4>
          <p>Свидетель, связей с местом меньше всего.</p>
        </button>
      </div>

      <div class="card" style="margin-top:12px">
        <strong>Выбранный подозреваемый:</strong>
        <span id="selectedSuspectText">Алексей Морозов</span>
      </div>
    </main>

    <nav class="footer-nav">
      <a class="active" href="./index.html">Дело</a>
      <a href="./case.html">Процесс</a>
      <a href="./board.html">Доска</a>
      <a href="./control.html">Управление</a>
    </nav>
  </div>

  <script src="./data.js"></script>
  <script src="./ai_engine.js"></script>
  <script src="./app.js"></script>
</body>
</html>
