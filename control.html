<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True Crime Bot — Управление</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">TC</div>
        <div>
          <h1>TRUE CRIME BOT</h1>
          <p>Страница 4 — Управление</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span>ДЕЛО</span><strong data-ui-chapter>1</strong></div>
        <div class="stat"><span>ОЧКИ</span><strong data-ui-points>20</strong></div>
        <div class="stat"><span>ЖИЗНИ</span><strong data-ui-lives>0</strong></div>
      </div>
    </header>

    <main class="panel">
      <div class="page-head">
        <div><span>СТРАНИЦА 4</span><h2>Управление, хронология, сброс</h2></div>
        <a class="btn btn-primary" href="./index.html">К делу</a>
      </div>

      <div class="card">
        <label for="progressInput">Прогресс вручную</label>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input id="progressInput" type="number" min="0" max="100" value="0" style="width:100%;padding:10px;border:1px solid #273240;border-radius:10px;background:#0f141b;color:#fff">
          <button class="btn" data-action="saveProgress" type="button">OK</button>
        </div>
      </div>

      <div class="card" style="margin-top:12px">
        <strong>Жизнь:</strong> <span data-life-text>Жизнь даётся раз в час.</span>
      </div>

      <div class="card" style="margin-top:12px">
        <button class="btn btn-danger" data-reset type="button">Сбросить сохранение</button>
      </div>
    </main>

    <nav class="footer-nav">
      <a href="./index.html">Дело</a>
      <a href="./case.html">Процесс</a>
      <a href="./board.html">Доска</a>
      <a class="active" href="./control.html">Управление</a>
    </nav>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
